<div class="header-top">
    <div class="logo">
        <a href="/">
            <span class="dot"></span>
            Every Fit
        </a>
    </div>
    <nav class="header-nav" id="lang-nav">
        <a href="/" id="lang-jp">JP</a>
        <a href="/en/" id="lang-en">EN</a>
    </nav>
</div>

<script>
    // 自動で現在ページの言語に active クラスを付与
    (function() {
        var isEn = window.location.pathname.startsWith('/en');
        var jpLink = document.getElementById('lang-jp');
        var enLink = document.getElementById('lang-en');
        if (jpLink && enLink) {
            if (isEn) {
                enLink.classList.add('active');
            } else {
                jpLink.classList.add('active');
            }
        }
    })();
</script>
